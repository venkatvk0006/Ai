name: Build VENKAT AI APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Zip and Prepare Project
        run: |
          # 1. நேராக அப்லோட் செய்யப்பட்ட zip ஃபைலைப் பிரித்தல் (Unzip)
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE. Extracting..."
            unzip -o -q "$ZIP_FILE" -d extracted_proj
            shopt -s dotglob
            # சப்-ஃபோல்டருக்குள் இருந்தால் வெளியே எடுத்தல்
            SUBDIR=$(find extracted_proj -maxdepth 2 -name "settings.gradle.kts" -printf '%h\n' | head -n 1)
            if [ -n "$SUBDIR" ]; then
              cp -rn "$SUBDIR"/* . || cp -r "$SUBDIR"/* .
            fi
            rm -rf extracted_proj
          fi

          # 2. app ஃபோல்டர் சரியாக உள்ளதா எனச் சரிபார்த்தல்
          if [ ! -d "app" ]; then
            echo "ERROR: 'app' ஃபோல்டர் இல்லை! தயவுசெய்து venkat-ai.zip ஃபைலை அப்படியே GitHub-ல் Upload செய்யவும்."
            exit 1
          fi

          # 3. .env ஃபைலை உருவாக்குதல் மற்றும் debugConfig வரியை நீக்குதல்
          cp .env.example .env || touch .env
          sed -i '/signingConfigs.getByName("debugConfig")/d' app/build.gradle.kts

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Venkat-AI-APK
          path: app/build/outputs/apk/debug/*.apk
