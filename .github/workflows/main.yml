name: Build VENKAT AI APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auto-Fix Project Structure and Keystore
        run: |
          # 1. கோப்புகள் சப்-ஃபோல்டருக்குள் இருந்தால் அவற்றை வெளியே கொண்டு வருதல்
          if [ ! -f "settings.gradle.kts" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "settings.gradle.kts" -printf '%h\n' | head -n 1)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              shopt -s dotglob
              mv "$SUBDIR"/* .
            fi
          fi
          
          # 2. விடுபட்ட .env ஃபைலை உருவாக்குதல்
          cp .env.example .env || touch .env
          
          # 3. debug.keystore பிரச்சனையைத் தவிர்க்க அந்த வரியை தானாக நீக்குதல்
          if [ -f "app/build.gradle.kts" ]; then
            sed -i '/signingConfigs.getByName("debugConfig")/d' app/build.gradle.kts
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Venkat-AI-APK
          path: app/build/outputs/apk/debug/*.apk
